{% extends "page.html" %}
{% block title %}...{% endblock %}
{% block content %}
<main class="login-card">
  <h1>WHO ARE YOU?</h1>
  <form method="post" action="{{ url_for('login') }}">
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <label class="sr-only" for="username">Username</label>
    <input id="username" name="username" placeholder="username" autocomplete="username" autocapitalize="none" required autofocus>
    <label class="sr-only" for="password">Password</label>
    <input id="password" name="password" type="password" placeholder="password" autocomplete="current-password" required>
    <label class="check"><input type="checkbox" name="remember" checked> stay signed in</label>
    <button type="submit">ENTER</button>
  </form>
  {% if error %}<p class="login-error" role="alert">{{ error }}</p>{% endif %}
  {% if registration_open %}<p class="login-alt"><a href="{{ url_for('register') }}">create an account</a></p>{% endif %}
</main>
{% endblock %}
