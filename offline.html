<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Offline</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #111; color: #eee; font-family: system-ui, sans-serif; text-align: center; padding: 1.5rem; }
    h1 { font-size: 1.3rem; margin: 0 0 .6rem; } p { color: #aaa; margin: .3rem 0 1.2rem; }
    button { font: inherit; padding: .6rem 1.4rem; border: 0; border-radius: 8px; background: #7ab8ff; color: #111; font-weight: 700; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <h1>The room can't be reached</h1>
    <p>Check that you're on the same Wi-Fi as the phone running the room.<br>Messages you already typed are kept and will send when it's back.</p>
    <button type="button" onclick="location.href='/room'">Try again</button>
  </main>
</body>
</html>
